<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#14213d">
  <title>管理者ログイン・アプリ選択</title>
  <link rel="stylesheet" href="admin.css?v=20261010">
</head>
<body>
  <header>
    <a class="brand" href="/admin/">管理者メニュー</a>
    <span id="status" role="status" aria-live="polite">ログインを確認しています…</span>
    <a class="back" href="/">ブログへ戻る</a>
    <button id="logout" hidden>ログアウト</button>
  </header>
  <main>
    <section id="gate" aria-labelledby="login-title">
      <div class="login">
        <div class="mark" aria-hidden="true">ADMIN</div>
        <h1 id="login-title">管理者ログイン</h1>
        <p>Googleで本人確認をすると、学習アプリを選べます。</p>
        <button id="login" disabled>Googleでログイン</button>
        <button id="redirect" class="sub" disabled>同じタブでログイン</button>
        <p id="message" role="status" aria-live="polite">ログインを確認しています…</p>
        <a href="/">ブログへ戻る</a>
      </div>
    </section>
    <section id="menu" aria-labelledby="menu-title" hidden>
      <h1 id="menu-title">アプリを選択</h1>
      <p class="lead">利用するアプリを選んでください。ログイン状態は共通です。</p>
      <nav class="grid" aria-label="管理者用アプリ">
        <a class="app" href="/admin/ds-study/">
          <span class="icon ds" aria-hidden="true">DS</span>
          <div><h2>DS検定 学習アプリ</h2><p>2,283問の問題演習・復習・学習進捗の管理</p></div>
          <span class="open">アプリを開く →</span>
        </a>
        <a class="app" href="/admin/books-study/">
          <span class="icon books" aria-hidden="true">BOOKS</span>
          <div><h2>書籍アプリ</h2><p>書籍の本文・要約・図版・プロンプトを閲覧</p></div>
          <span class="open">アプリを開く →</span>
        </a>
      </nav>
    </section>
  </main>
  <script type="module" src="admin.js?v=20261010"></script>
</body>
</html>
